[package]
name = "craftpull"
version = "0.5.2"
edition = "2021"
rust-version = "1.82"
description = "CraftPull — release and source manager for GitHub repositories"
authors = ["Kosenkov Ivan <support@chekak.store>"]
homepage = "https://chekak.store"
repository = "https://github.com/KosenkovPro/craftpuller"
license = "MIT OR Apache-2.0"
default-run = "craftpull"

[[bin]]
name = "craftpull"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
egui = "0.31"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "charset", "http2"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.19"
muda = "0.15"
sha2 = "0.10"
# Распаковка релизных архивов: zip (Windows, macOS) и tar.gz (Linux).
zip = { version = "4.6", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dirs = "6"
open = "5"
bytes = "1"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
# Временные папки для тестов распаковки.
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
