name: Portable builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64 (portable zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: ./packaging/build-portable.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: craftpull-windows-x64
          path: dist/*.zip

  ubuntu:
    name: Ubuntu x86_64 (portable tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Build and package
        run: ./packaging/build-portable.sh
      - uses: actions/upload-artifact@v4
        with:
          name: craftpull-ubuntu-x86_64
          path: dist/*.tar.gz
