name: Portable builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build portable packages
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            package: ./packaging/build-portable.ps1
          - os: ubuntu-latest
            target: linux-x86_64
            package: ./packaging/build-portable.sh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Build and package
        shell: pwsh
        run: ${{ matrix.package }}
      - uses: actions/upload-artifact@v4
        with:
          name: craftpull-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: CraftPull ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
          body: |
            **CraftPull ${{ github.ref_name }}** — release & source manager for GitHub.

            | Platform | Package |
            |---|---|
            | Windows x64 | `craftpull-*-windows-x64.zip` — portable, no installer |
            | Linux x86_64 | `craftpull-*-linux-x86_64.tar.gz` — with `install.sh` and a `.desktop` entry |

            The Windows archive contains the executable, the icon and the README: unpack it and
            run `craftpull.exe`. The Linux archive unpacks to `install.sh`, which puts the binary
            into `~/.local/bin` and registers the desktop entry and the icon.

            The program has no runtime dependencies beyond the usual system libraries.
            Sources: the `main` branch of this repository.
