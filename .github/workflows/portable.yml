name: Portable builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64 (portable zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and package
        shell: pwsh
        run: ./packaging/build-portable.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: craftpull-windows-x64
          path: dist/*.zip

  ubuntu:
    name: Linux x86_64 (portable tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libfontconfig1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libgl1-mesa-dev
      - name: Build and package
        shell: bash
        run: bash ./packaging/build-portable.sh
      - uses: actions/upload-artifact@v4
        with:
          name: craftpull-linux-x86_64
          path: dist/*.tar.gz

  release:
    name: Publish GitHub release
    needs: [windows, ubuntu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: CraftPull ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
          body: |
            **CraftPull ${{ github.ref_name }}** — release & source manager for GitHub.

            | Platform | Package |
            |---|---|
            | Windows x64 | `craftpull-*-windows-x64.zip` — portable, no installer |
            | Linux x86_64 | `craftpull-*-linux-x86_64.tar.gz` — with `install.sh` and a `.desktop` entry |

            The Windows archive contains the executable, the icon and the README: unpack it and
            run `craftpull.exe`. The Linux archive unpacks to `install.sh`, which puts the binary
            into `~/.local/bin` and registers the desktop entry and the icon.

            The program has no runtime dependencies beyond the usual system libraries.
            Sources: the `main` branch of this repository.
