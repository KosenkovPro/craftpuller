name: Portable builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64 (portable zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and package
        shell: pwsh
        run: ./packaging/build-portable.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: craftpull-windows-x64
          path: dist/*.zip

  ubuntu:
    name: Linux x86_64 (portable tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libfontconfig1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libgl1-mesa-dev
      - name: Build and package
        shell: bash
        run: bash ./packaging/build-portable.sh
      - name: Build .deb package
        shell: bash
        run: bash ./packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: craftpull-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.deb

  macos:
    name: macOS universal (.app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build and package
        run: bash ./packaging/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: craftpull-macos-universal
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg
            dist/*.pkg

  release:
    name: Publish GitHub release
    needs: [windows, ubuntu, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: CraftPull ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/*.dmg
            dist/*.pkg
          body: |
            **CraftPull ${{ github.ref_name }}** — release & source manager for GitHub.

            | Platform | Package |
            |---|---|
            | Windows x64 | `craftpull-*-windows-x64.zip` — portable, no installer |
            | macOS (Apple Silicon) | `craftpull-*-macos-arm64.zip` — `CraftPull.app` |
            | macOS (Intel) | `craftpull-*-macos-x64.zip` — `CraftPull.app` |
            | macOS (both) | `craftpull-*-macos-universal.zip` — `CraftPull.app` |
            | macOS, disk image | `craftpull-*-macos-universal.dmg` — drag the app into «Applications» |
            | macOS, installer | `craftpull-*-macos-universal.pkg` — step-by-step installation |
            | macOS, archive | `craftpull-*-macos-universal.tar.gz` |
            | Ubuntu / Debian x86_64 | `craftpull-*-linux-x86_64.deb` — `sudo apt install ./craftpull-*.deb` |
            | Linux x86_64 | `craftpull-*-linux-x86_64.tar.gz` — with `install.sh` and a `.desktop` entry |

            The Windows archive contains the executable, the icon and the README: unpack it and
            run `craftpull.exe`. The macOS archives contain `CraftPull.app` — unpack it and drag
            the app into «Applications», or run it directly from the folder. The `.dmg` shows the
            usual window with the app and the «Applications» shortcut. The `.pkg` is a regular
            step-by-step installer: it greets you, shows the license, lets you choose the folder
            and puts the app into `/Applications`. The `.deb` package installs the binary
            into `/usr/bin`, the icon into `/usr/share/icons` and the desktop entry into
            `/usr/share/applications`. The tar.gz archive unpacks to `install.sh`, which puts the
            binary into `~/.local/bin` and registers the desktop entry and the icon.

            The macOS builds are not signed, so the system may report that the application is not
            verified: open it with the right mouse button and choose «Open».

            The program updates itself: the settings have an update section that checks for a
            new version, downloads it, verifies the SHA-256 sum and replaces the program file.
            `craftpull --update` does the same from the command line.

            The program has no runtime dependencies beyond the usual system libraries.
            Sources: the `main` branch of this repository.
